<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vom Gen zum Protein – Lernspiel</title>
<style>
:root{
  --bg:#08111d;--panel:#0f1d31;--panel2:#162640;--text:#f5f7fb;--muted:#a8b6c8;
  --good:#63e6be;--bad:#ff6b6b;--accent:#74c0fc;--yellow:#ffd43b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{touch-action:none}
#app{width:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:8px}
#topbar{display:grid;grid-template-columns:1.3fr .9fr auto auto;gap:8px;align-items:stretch}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 12px}
#titleBox .title{font-size:20px;font-weight:900;line-height:1.1}
#titleBox .sub{font-size:12px;color:var(--muted);margin-top:4px}
#currentBox .label,#unlockBox .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#currentBox .value,#unlockBox .value{font-size:18px;font-weight:850;line-height:1.1;margin-top:5px}
#menuBtn,#resetBtn,#overlayPrimary,#overlaySecondary{border:none;border-radius:14px;font-weight:900;font-size:16px}
#menuBtn,#resetBtn{padding:0 16px;background:var(--panel2);color:var(--text);border:1px solid rgba(255,255,255,.08)}
#stage{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.09);background:#07131f}
#gameFrame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#07131f;display:none}
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,10,18,.78);backdrop-filter:blur(4px);padding:20px}
#overlayCard{width:min(760px,95%);max-height:92%;overflow:auto;background:var(--panel);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#overlayCard h1{margin:0 0 10px;font-size:clamp(24px,4vw,40px)}
#overlayCard p{margin:10px 0;line-height:1.4;color:#d9e2ef}
#overlayButtons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#overlayPrimary{min-height:52px;padding:0 20px;background:var(--accent);color:#06111e}
#overlaySecondary{min-height:52px;padding:0 18px;background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
#levelGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.levelBtn{text-align:left;min-height:120px;padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:#15253d;color:var(--text)}
.levelBtn .n{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.levelBtn .t{font-size:22px;font-weight:900;line-height:1.1;margin-top:6px}
.levelBtn .d{font-size:14px;color:#dce5f0;margin-top:6px;line-height:1.35}
.levelBtn.unlocked{background:linear-gradient(180deg,#19314d,#14263d);cursor:pointer}
.levelBtn.locked{opacity:.5;filter:saturate(.55);cursor:not-allowed}
.levelBtn.done{outline:2px solid rgba(99,230,190,.75);background:linear-gradient(180deg,#173447,#132a37)}
.badge{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}
.badge.ok{background:rgba(99,230,190,.15);color:var(--good)}
.badge.lock{background:rgba(255,255,255,.08);color:var(--muted)}
.badge.open{background:rgba(116,192,252,.14);color:var(--accent)}
@media(max-width:900px){
  #topbar{grid-template-columns:1fr 1fr;}
  #menuBtn,#resetBtn{min-height:56px}
  #levelGrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="panel" id="titleBox"><div class="title">Vom Gen zum Protein</div><div class="sub">Vier aufeinanderfolgende Minispiele: Transkription → Kernpore → Ribosom → Translation</div></div>
    <div class="panel" id="currentBox"><div class="label">Aktives Level</div><div class="value" id="currentValue">–</div></div>
    <div class="panel" id="unlockBox"><div class="label">Freigeschaltet</div><div class="value" id="unlockValue">1 / 4</div></div>
    <div style="display:flex;gap:8px"><button id="menuBtn">Levelauswahl</button><button id="resetBtn">Reset</button></div>
  </div>
  <div id="stage">
    <iframe id="gameFrame" tabindex="0" sandbox="allow-scripts allow-same-origin"></iframe>
    <div id="overlay"><div id="overlayCard"></div></div>
  </div>
</div>

const LEVELS = [{"id": 1, "key": "level1", "title": "Level 1 · Transkription", "subtitle": "Baue die mRNA.", "goal": "Baue die mRNA.", "desc": "Spiele die Transkription als Timing-Spiel. Bei 30 richtigen Basen wird Level 2 freigeschaltet. Danach läuft Level 1 als Endlos-Highscore weiter und wird ohne Geschwindigkeitslimit immer schneller."}, {"id": 2, "key": "level2", "title": "Level 2 · Weg zur Kernpore", "subtitle": "Erreiche die Kernpore.", "goal": "Erreiche die Kernpore.", "desc": "Steuere die mRNA durch den Zellkern und weiche Chromosomen, Histonen, Ionen und dem Kernkörperchen aus, bis du eine Kernpore erreichst."}, {"id": 3, "key": "level3", "title": "Level 3 · Weg zum Ribosom", "subtitle": "Erreiche ein Ribosom.", "goal": "Erreiche ein Ribosom.", "desc": "Folge im Cytoplasma dem glatten Endoplasmatischen Reticulum, weiche Organellen aus und erreiche am Ende ein Ribosom."}, {"id": 4, "key": "level4", "title": "Level 4 · Translation", "subtitle": "Stelle das Protein her.", "goal": "Stelle das Protein her.", "desc": "Steuere das Ribosom und fange die passenden tRNAs für die angezeigten Codons, bis das Protein hergestellt ist."}];
const STORAGE_KEY = 'vom_gen_zum_protein_unlock_v1';
const STORAGE_DONE = 'vom_gen_zum_protein_done_v1';
let unlocked = Math.max(1, parseInt(localStorage.getItem(STORAGE_KEY) || '1', 10) || 1);
let doneLevels = JSON.parse(localStorage.getItem(STORAGE_DONE) || '[]');
if(!Array.isArray(doneLevels)) doneLevels = [];
let currentLevel = 0;
let currentBlobUrl = null;
let pendingStart = false;
const overlay = document.getElementById('overlay');
const overlayCard = document.getElementById('overlayCard');
const frame = document.getElementById('gameFrame');
const currentValue = document.getElementById('currentValue');
const unlockValue = document.getElementById('unlockValue');
const menuBtn = document.getElementById('menuBtn');
const resetBtn = document.getElementById('resetBtn');

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, String(unlocked));
  localStorage.setItem(STORAGE_DONE, JSON.stringify(doneLevels));
  updateHud();
}
function updateHud(){
  currentValue.textContent = currentLevel ? `Level ${currentLevel}` : '–';
  unlockValue.textContent = `${unlocked} / 4`;
}
function levelById(id){ return LEVELS.find(l => l.id === id); }
function openMenu(){
  frame.style.display = currentLevel ? 'block' : 'none';
  overlay.style.display = 'flex';
  const cards = LEVELS.map(l => {
    const isUnlocked = l.id <= unlocked;
    const isDone = doneLevels.includes(l.id);
    return `<button class="levelBtn ${isUnlocked?'unlocked':'locked'} ${isDone?'done':''}" data-level="${l.id}" ${isUnlocked?'':'disabled'}>
      <div class="n">Level ${l.id}</div>
      <div class="t">${l.title.replace(/^Level \d+ · /,'')}</div>
      <div class="d">${l.goal}</div>
      <span class="badge ${isDone?'ok':(isUnlocked?'open':'lock')}">${isDone?'geschafft':(isUnlocked?'freigeschaltet':'gesperrt')}</span>
    </button>`;
  }).join('');
  overlayCard.innerHTML = `
    <h1>Levelauswahl</h1>
    <p>Spiele die vier Schritte der Proteinbiosynthese nacheinander. Geschaffte Level schalten das nächste Level frei.</p>
    <div id="levelGrid">${cards}</div>
    <div id="overlayButtons"><button id="overlaySecondary">Schließen</button></div>`;
  overlayCard.querySelectorAll('.levelBtn.unlocked').forEach(btn => btn.addEventListener('click', () => showGoal(parseInt(btn.dataset.level, 10))));
  overlayCard.querySelector('#overlaySecondary').addEventListener('click', () => {
    overlay.style.display = 'none';
    if(currentLevel){
      frame.style.display = 'block';
      setTimeout(focusGameFrame,0);
    }
  });
}
function showGoal(id, autoStart=false){
  const l = levelById(id); if(!l || id > unlocked) return;
  currentLevel = id; updateHud();
  overlay.style.display = 'flex';
  frame.style.display = currentBlobUrl ? 'block' : 'none';
  overlayCard.innerHTML = `
    <h1>${l.title}</h1>
    <p><b>Ziel:</b> ${l.goal}</p>
    <p>${l.desc}</p>
    <div id="overlayButtons">
      <button id="overlayPrimary">Level starten</button>
      <button id="overlaySecondary">Zur Levelauswahl</button>
    </div>`;
  overlayCard.querySelector('#overlayPrimary').addEventListener('click', () => launchLevel(id));
  overlayCard.querySelector('#overlaySecondary').addEventListener('click', openMenu);
  if(autoStart) setTimeout(() => overlayCard.querySelector('#overlayPrimary').click(), 0);
}
function decodeBase64ToHtml(b64){
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function focusGameFrame(){
  try{
    frame.focus({preventScroll:true});
  }catch(e){
    try{ frame.focus(); }catch(err){}
  }
  try{
    frame.contentWindow.focus();
  }catch(e){}
}
function launchLevel(id){
  const l = levelById(id); if(!l) return;
  if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  const html = decodeBase64ToHtml(GAME_HTML[l.key]);
  currentBlobUrl = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  pendingStart = true;
  frame.style.display = 'block';
  frame.src = currentBlobUrl;
  overlay.style.display = 'none';
  currentLevel = id; updateHud();

  // Tastatursteuerung soll ohne vorherigen Klick ins Spielfeld aktiv sein.
  setTimeout(focusGameFrame, 0);
}
frame.addEventListener('load', () => {
  if(!pendingStart) return;
  pendingStart = false;
  setTimeout(() => {
    try { frame.contentWindow.postMessage({launcherStart:true, level:currentLevel}, '*'); } catch(e) {};
    focusGameFrame();
  }, 80);

  // Einige Browser übernehmen den Fokus erst nach dem ersten Rendering-Zyklus.
  setTimeout(focusGameFrame, 180);
});
window.addEventListener('message', (e) => {
  const data = e.data || {};

  if(data.launcherEvent === 'gotoLevel'){
    const target = parseInt(data.level,10);
    if(target >= 1 && target <= unlocked){
      showGoal(target);
    }
    return;
  }

  if(data.launcherEvent !== 'complete') return;
  const map = { level1:1, level2:2, level3:3, level4:4 };
  const finished = map[data.game];
  if(finished !== currentLevel) return;
  if(!doneLevels.includes(finished)) doneLevels.push(finished);
  doneLevels = doneLevels.sort((a,b)=>a-b);
  unlocked = Math.max(unlocked, Math.min(4, finished + 1));
  saveProgress();

  // Die 30 Basen in Level 1 schalten nur frei.
  // Das Endlos-Highscore-Spiel bleibt weiter aktiv.
  if(finished === 1) return;

  handleCompletion(finished);
});
function handleCompletion(id){
  if(id < 4){
    const next = levelById(id+1);
    overlay.style.display = 'flex';
    overlayCard.innerHTML = `
      <h1>Level ${id} geschafft</h1>
      <p>Gut gemacht! Das nächste Level wurde freigeschaltet.</p>
      <p><b>Nächstes Ziel:</b> ${next.goal}</p>
      <div id="overlayButtons">
        <button id="overlayPrimary">Weiter zu Level ${next.id}</button>
        <button id="overlaySecondary">Zur Levelauswahl</button>
      </div>`;
    overlayCard.querySelector('#overlayPrimary').addEventListener('click', () => showGoal(next.id));
    overlayCard.querySelector('#overlaySecondary').addEventListener('click', openMenu);
  } else {
    overlay.style.display = 'flex';
    overlayCard.innerHTML = `
      <h1>Proteinbiosynthese geschafft</h1>
      <p>Du hast den gesamten Weg vom Gen zum Protein durchgespielt.</p>
      <p>Bei der <b>Transkription</b> hast du die mRNA aufgebaut, sie durch die Kernpore zu einem Ribosom transportiert und anschließend bei der <b>Translation</b> das Protein hergestellt.</p>
      <div id="overlayButtons">
        <button id="overlayPrimary">Zur Levelauswahl</button>
      </div>`;
    overlayCard.querySelector('#overlayPrimary').addEventListener('click', openMenu);
  }
}
menuBtn.addEventListener('click', openMenu);
resetBtn.addEventListener('click', () => {
  if(!confirm('Gespeicherten Fortschritt wirklich zurücksetzen?')) return;
  unlocked = 1; doneLevels = []; currentLevel = 0; saveProgress(); openMenu();
});
updateHud();
openMenu();
</script>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bakterienwachstum auf einer Agarplatte</title>
  <style>
    :root {
      --ink: #17312f;
      --muted: #5c716e;
      --paper: #f7fbf7;
      --card: rgba(255, 255, 255, 0.92);
      --line: #d7e5df;
      --teal: #087d79;
      --teal-dark: #075d5f;
      --mint: #ddf1e8;
      --food: #e3a62f;
      --dead: #657273;
      --shadow: 0 16px 45px rgba(27, 63, 57, 0.12);
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(99, 197, 166, 0.16), transparent 28rem),
        linear-gradient(180deg, #f9fcf9 0%, #eef7f2 100%);
    }

    button, input { font: inherit; }

    .app {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: clamp(10px, 1.4vw, 18px);
    }

    header {
      margin: 0 2px 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(360px, 0.92fr);
      gap: clamp(10px, 1.3vw, 18px);
      align-items: start;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(184, 211, 201, 0.78);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      padding: 9px 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(249, 253, 250, 0.75);
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 850;
    }

    .phase-badge {
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: #d8eee7;
      color: #0b625c;
      font-size: 0.78rem;
      font-weight: 800;
      transition: background .25s ease, color .25s ease;
    }

    .chart-wrap {
      position: relative;
      padding: 4px 6px 0;
    }

    #growthChart {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 5 / 3;
      min-height: 0;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .phase-band { opacity: 0.52; transition: opacity .25s ease; }
    .phase-band.active { opacity: 1; }
    .phase-label { font-size: 15px; font-weight: 800; fill: #234542; }
    .axis-label { font-size: 16px; font-weight: 800; fill: #284a46; }
    .axis-tick { font-size: 12px; fill: #667a77; }

    #curveGhost {
      fill: none;
      stroke: #9cb9b4;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.52;
    }

    #curveActive {
      fill: none;
      stroke: var(--teal);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #timeLine {
      stroke: #ed704c;
      stroke-width: 2.5;
      stroke-dasharray: 4 7;
      opacity: .8;
    }

    #timeDot {
      fill: #fff;
      stroke: #ed704c;
      stroke-width: 6;
      filter: drop-shadow(0 3px 6px rgba(182, 68, 36, .28));
    }

    #timeHandle { cursor: ew-resize; }
    #timeHandle:focus { outline: none; }
    #timeHandle:focus #timeDot { stroke-width: 9; }
    #timeHit { stroke: transparent; stroke-width: 38; pointer-events: stroke; }

    .chart-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      background: var(--teal);
      box-shadow: 0 4px 10px rgba(8, 125, 121, .22);
      cursor: pointer;
      touch-action: manipulation;
    }

    .play-button:hover { background: var(--teal-dark); }
    .play-button:focus-visible {
      outline: 4px solid rgba(237, 112, 76, .28);
      outline-offset: 3px;
    }

    .play-icon { width: 18px; height: 18px; fill: currentColor; }
    .pause-bars { display: none; }
    .is-playing .play-triangle { display: none; }
    .is-playing .pause-bars { display: block; }

    .petri-body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
    }

    .petri-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 3px 6px 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(246, 218, 139, .16), transparent 45%),
        linear-gradient(180deg, rgba(251, 253, 248, .5), rgba(235, 246, 239, .5));
    }

    #petriDish {
      display: block;
      width: min(100%, 430px);
      height: auto;
      filter: drop-shadow(0 14px 18px rgba(52, 72, 56, .17));
    }

    .nutrient {
      fill: #e6ae36;
      stroke: rgba(126, 81, 0, .18);
      stroke-width: 1;
      transition: opacity .28s ease;
    }

    .bacterium { transition: opacity .2s ease; }
    .bacterium-body { stroke: rgba(1, 60, 61, .55); stroke-width: 1.2; }
    .bacterium-line { stroke: rgba(255,255,255,.72); stroke-width: 1.15; stroke-linecap: round; }
    .dead-cell { transition: opacity .25s ease; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 11px;
      margin: -3px 0 7px;
      color: #4d6561;
      font-size: .69rem;
      font-weight: 700;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
    .legend .live { background: #087d79; }
    .legend .food { background: var(--food); }
    .legend .dead { background: var(--dead); }

    .status-panel {
      padding: 9px 12px 11px;
      border-top: 1px solid var(--line);
      background: rgba(249, 253, 250, .78);
    }

    .meters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .meter {
      padding: 7px 8px;
      border: 1px solid #d9e6e1;
      border-radius: 10px;
      background: #fff;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      color: #5c706c;
      font-size: .7rem;
      font-weight: 800;
    }

    .meter-label output { color: var(--ink); }
    .meter-track { height: 7px; overflow: hidden; border-radius: 999px; background: #e6eeeb; }
    .meter-fill { height: 100%; border-radius: inherit; transition: width .22s ease; }
    #foodFill { background: linear-gradient(90deg, #edbd4d, #d79214); }
    #spaceFill { background: linear-gradient(90deg, #7fd2c5, #25938d); }

    .rate-row {
      display: grid;
      grid-template-columns: 65px 1fr 32px;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      color: #59706b;
      font-size: .68rem;
      font-weight: 800;
    }

    .rate-track { display: flex; gap: 3px; }
    .rate-track i { flex: 1; height: 6px; border-radius: 999px; background: #e3ebe8; transition: background .2s ease; }
    .rate-track i.on.birth { background: #25a491; }
    .rate-track i.on.death { background: #7a8587; }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      #petriDish { width: min(62vw, 430px); }
    }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      header { margin: 4px 3px 10px; }
      .card { border-radius: 19px; }
      .phase-label { font-size: 11px; }
      .axis-label { font-size: 13px; }
      #petriDish { width: min(82vw, 430px); }
      .meters { grid-template-columns: 1fr; }
    }

    @media (min-width: 861px) and (max-height: 820px) {
      .app { padding-block: 10px; }
      #petriDish { width: min(100%, 360px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Bakterienwachstum auf einer Agarplatte</h1>
    </header>

    <section class="workspace" aria-label="Interaktive Simulation">
      <article class="card">
        <div class="card-head">
          <h2 class="card-title">Wachstumskurve</h2>
          <div class="chart-actions">
            <button class="play-button" id="playButton" type="button" aria-label="Animation abspielen">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path class="play-triangle" d="M8 5.7a1 1 0 0 1 1.52-.85l9.1 6.3a1 1 0 0 1 0 1.7l-9.1 6.3A1 1 0 0 1 8 18.3V5.7Z"/>
                <path class="pause-bars" d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/>
              </svg>
            </button>
            <span class="phase-badge" id="phaseBadge">Latenzphase</span>
          </div>
        </div>

        <div class="chart-wrap">
          <svg id="growthChart" viewBox="0 0 900 540" role="img" aria-labelledby="chartTitle chartDescription">
            <title id="chartTitle">Wachstumskurve einer Bakterienkultur</title>
            <desc id="chartDescription">Die Kurve zeigt Latenzphase, exponentielle Phase, stationäre Phase und Absterbephase. Ein Zeiger wird mit dem Zeitregler über die Kurve bewegt.</desc>
            <defs>
              <linearGradient id="plotBg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#f3f9f5"/>
              </linearGradient>
              <clipPath id="plotClip"><rect x="76" y="52" width="772" height="414" rx="18"/></clipPath>
            </defs>

            <rect x="76" y="52" width="772" height="414" rx="18" fill="url(#plotBg)" stroke="#cfe0d9"/>
            <g clip-path="url(#plotClip)">
              <rect class="phase-band active" data-phase="0" x="76" y="52" width="115.8" height="414" fill="#dff3ee"/>
              <rect class="phase-band" data-phase="1" x="191.8" y="52" width="270.2" height="414" fill="#bce8df"/>
              <rect class="phase-band" data-phase="2" x="462" y="52" width="139" height="414" fill="#90d3ca"/>
              <rect class="phase-band" data-phase="3" x="601" y="52" width="247" height="414" fill="#62b7b4"/>

              <g stroke="#cbdcd6" stroke-width="1">
                <line x1="76" y1="135" x2="848" y2="135"/>
                <line x1="76" y1="218" x2="848" y2="218"/>
                <line x1="76" y1="301" x2="848" y2="301"/>
                <line x1="76" y1="384" x2="848" y2="384"/>
              </g>

              <path id="curveGhost"/>
              <path id="curveActive"/>
              <g id="timeHandle" role="slider" tabindex="0" aria-label="Zeitpunkt im Wachstumsverlauf" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <line id="timeHit" x1="76" y1="62" x2="76" y2="466"/>
                <line id="timeLine" x1="76" y1="62" x2="76" y2="466"/>
                <circle id="timeDot" cx="76" cy="430" r="9"/>
              </g>
            </g>

            <g class="phase-label" text-anchor="middle">
              <text x="134" y="78"><tspan x="134">Latenz-</tspan><tspan x="134" dy="17">phase</tspan></text>
              <text x="327" y="78"><tspan x="327">exponentielle</tspan><tspan x="327" dy="17">Phase</tspan></text>
              <text x="531" y="78"><tspan x="531">stationäre</tspan><tspan x="531" dy="17">Phase</tspan></text>
              <text x="724" y="87">Absterbephase</text>
            </g>

            <g stroke="#4f6a65" stroke-width="2.2" stroke-linecap="round">
              <line x1="76" y1="466" x2="858" y2="466"/>
              <line x1="76" y1="476" x2="76" y2="42"/>
            </g>
            <g class="axis-tick" text-anchor="middle">
              <text x="76" y="489">0</text><text x="230" y="489">20</text><text x="385" y="489">40</text>
              <text x="539" y="489">60</text><text x="694" y="489">80</text><text x="848" y="489">100</text>
            </g>
            <text class="axis-label" x="462" y="525" text-anchor="middle">Zeit</text>
            <text class="axis-label" x="24" y="259" text-anchor="middle" transform="rotate(-90 24 259)">Anzahl lebender Bakterien</text>
          </svg>
        </div>
      </article>

      <article class="card petri-body">
        <div>
          <div class="card-head">
            <h2 class="card-title">Agarplatte</h2>
            <span class="phase-badge" id="populationBadge">wenige Bakterien</span>
          </div>
          <div class="petri-stage">
            <svg id="petriDish" viewBox="0 0 620 620" role="img" aria-labelledby="dishTitle dishDescription">
              <title id="dishTitle">Schematische Agarplatte</title>
              <desc id="dishDescription">Lebende Bakterien sind türkis, Nährstoffe gelb und abgestorbene Bakterien grau dargestellt.</desc>
              <defs>
                <radialGradient id="agarGradient" cx="38%" cy="32%" r="72%">
                  <stop offset="0" stop-color="#fff9d9"/>
                  <stop offset=".58" stop-color="#f6e8ae"/>
                  <stop offset="1" stop-color="#e7cc79"/>
                </radialGradient>
                <radialGradient id="glassGradient" cx="35%" cy="26%" r="75%">
                  <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
                  <stop offset=".72" stop-color="#d9eee6" stop-opacity=".20"/>
                  <stop offset="1" stop-color="#9bbdb3" stop-opacity=".55"/>
                </radialGradient>
                <clipPath id="dishClip"><circle cx="310" cy="310" r="257"/></clipPath>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#315e55" flood-opacity=".25"/>
                </filter>
              </defs>
              <circle cx="310" cy="310" r="286" fill="url(#glassGradient)" stroke="#91b7ae" stroke-width="5"/>
              <circle cx="310" cy="310" r="260" fill="url(#agarGradient)" stroke="#d3ba68" stroke-width="4"/>
              <g clip-path="url(#dishClip)">
                <g id="nutrientLayer"></g>
                <g id="deadLayer"></g>
                <g id="bacteriaLayer" filter="url(#softShadow)"></g>
                <ellipse cx="245" cy="166" rx="144" ry="59" fill="#fff" opacity=".10" transform="rotate(-18 245 166)" pointer-events="none"/>
              </g>
              <path d="M102 168c51-82 138-126 230-127" fill="none" stroke="#fff" stroke-opacity=".63" stroke-width="10" stroke-linecap="round"/>
              <circle cx="310" cy="310" r="275" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>
            </svg>
          </div>
          <div class="legend" aria-label="Legende">
            <span><i class="live"></i>lebendes Bakterium</span>
            <span><i class="food"></i>Nährstoff</span>
            <span><i class="dead"></i>abgestorben</span>
          </div>
        </div>

        <div class="status-panel">
          <div class="meters">
            <div class="meter">
              <div class="meter-label"><span>Nährstoffvorrat</span><output id="foodValue">100 %</output></div>
              <div class="meter-track"><div class="meter-fill" id="foodFill" style="width:100%"></div></div>
            </div>
            <div class="meter">
              <div class="meter-label"><span>freier Platz</span><output id="spaceValue">96 %</output></div>
              <div class="meter-track"><div class="meter-fill" id="spaceFill" style="width:96%"></div></div>
            </div>
          </div>

          <div class="rate-row"><span>Teilungen</span><span class="rate-track" id="birthRate"></span><output id="birthLabel">gering</output></div>
          <div class="rate-row"><span>Absterben</span><span class="rate-track" id="deathRate"></span><output id="deathLabel">gering</output></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const growthChart = document.getElementById("growthChart");
      const playButton = document.getElementById("playButton");
      const curveGhost = document.getElementById("curveGhost");
      const curveActive = document.getElementById("curveActive");
      const timeHandle = document.getElementById("timeHandle");
      const timeHit = document.getElementById("timeHit");
      const timeLine = document.getElementById("timeLine");
      const timeDot = document.getElementById("timeDot");
      const phaseBadge = document.getElementById("phaseBadge");
      const populationBadge = document.getElementById("populationBadge");
      const foodFill = document.getElementById("foodFill");
      const spaceFill = document.getElementById("spaceFill");
      const foodValue = document.getElementById("foodValue");
      const spaceValue = document.getElementById("spaceValue");
      const nutrientLayer = document.getElementById("nutrientLayer");
      const bacteriaLayer = document.getElementById("bacteriaLayer");
      const deadLayer = document.getElementById("deadLayer");

      const phases = [
        {
          end: 15,
          name: "Latenzphase",
          population: "wenige Bakterien",
          color: "#d8eee7",
          ink: "#0b625c"
        },
        {
          end: 50,
          name: "exponentielle Phase",
          population: "schnelle Vermehrung",
          color: "#c4ece3",
          ink: "#086b66"
        },
        {
          end: 68,
          name: "stationäre Phase",
          population: "Platte vollständig besiedelt",
          color: "#a1dcd4",
          ink: "#075e5c"
        },
        {
          end: 101,
          name: "Absterbephase",
          population: "Population nimmt ab",
          color: "#5daead",
          ink: "#ffffff"
        }
      ];

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const smoothstep = value => {
        const x = clamp(value, 0, 1);
        return x * x * (3 - 2 * x);
      };

      const MAX_LIVE = 420;

      function stateAt(t) {
        let population, food, space, dead, birth, death;
        if (t < 15) {
          const q = smoothstep(t / 15);
          population = 0.05 + 0.025 * q;
          food = 100 - 4 * q;
          space = 96 - 3 * q;
          dead = 0;
          birth = 1;
          death = 0;
        } else if (t < 50) {
          const q = smoothstep((t - 15) / 35);
          population = 0.075 + 0.805 * q;
          food = 96 - 48 * q;
          space = 93 * (1 - q);
          dead = 2 * q;
          birth = 5;
          death = 1;
        } else if (t < 68) {
          const q = smoothstep((t - 50) / 18);
          population = 0.88;
          food = 48 - 30 * q;
          space = 0;
          dead = 12 + 24 * q;
          birth = 3;
          death = 3;
        } else {
          const q = smoothstep((t - 68) / 32);
          population = 0.845 * Math.pow(1 - q, 1.25) + 0.035;
          food = 18 * Math.pow(1 - q, 1.8);
          space = 65 * q;
          dead = 36 + 304 * q;
          birth = Math.max(0, Math.round(2 - 2 * q));
          death = 5;
        }

        const normalized = clamp((population - 0.035) / 0.845, 0, 1);
        return {
          population,
          food: clamp(food, 0, 100),
          space: clamp(space, 0, 100),
          dead,
          birth,
          death,
          liveCount: Math.round(8 + normalized * (MAX_LIVE - 8)),
          nutrientCount: Math.round(clamp(food, 0, 100) * 1.85),
          deadCount: Math.round(dead)
        };
      }

      function chartPoint(t) {
        const state = stateAt(t);
        return {
          x: 76 + 7.72 * t,
          y: 446 - state.population * 355
        };
      }

      const points = [];
      for (let t = 0; t <= 100; t += 0.5) {
        const p = chartPoint(t);
        points.push(p);
      }
      const toPath = list => list.map((p, index) =>
        `${index ? "L" : "M"}${p.x.toFixed(2)},${p.y.toFixed(2)}`
      ).join(" ");
      const fullPath = toPath(points);
      curveGhost.setAttribute("d", fullPath);

      function activePathAt(t) {
        const completePoints = points.slice(0, Math.floor(t * 2) + 1);
        const exactPoint = chartPoint(t);
        const last = completePoints[completePoints.length - 1];
        if (!last || Math.abs(last.x - exactPoint.x) > 0.01) completePoints.push(exactPoint);
        return toPath(completePoints);
      }

      function seededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value += 0x6D2B79F5;
          let r = value;
          r = Math.imul(r ^ r >>> 15, r | 1);
          r ^= r + Math.imul(r ^ r >>> 7, r | 61);
          return ((r ^ r >>> 14) >>> 0) / 4294967296;
        };
      }

      const random = seededRandom(82426);
      const seeds = [
        { x: 228, y: 224 }, { x: 384, y: 205 }, { x: 304, y: 360 },
        { x: 183, y: 385 }, { x: 433, y: 382 }
      ];

      function insideDish(x, y, margin = 0) {
        return Math.hypot(x - 310, y - 310) < 248 - margin;
      }

      const positions = [];
      const spacing = 21.5;
      for (let y = 76; y <= 544; y += spacing * 0.88) {
        const row = Math.round((y - 76) / (spacing * .88));
        for (let x = 78 + (row % 2) * spacing / 2; x <= 542; x += spacing) {
          const px = x + (random() - .5) * 7;
          const py = y + (random() - .5) * 7;
          if (insideDish(px, py, 8)) {
            const seedDistance = Math.min(...seeds.map(s => Math.hypot(px - s.x, py - s.y)));
            positions.push({
              x: px,
              y: py,
              angle: random() * 180,
              score: seedDistance + random() * 36,
              shade: random()
            });
          }
        }
      }
      positions.sort((a, b) => a.score - b.score);

      const nutrientEls = [];
      for (let i = 0; i < 185; i++) {
        let x, y;
        do {
          x = 67 + random() * 486;
          y = 67 + random() * 486;
        } while (!insideDish(x, y, 4));
        const circle = document.createElementNS(SVG_NS, "circle");
        circle.setAttribute("class", "nutrient");
        circle.setAttribute("cx", x.toFixed(2));
        circle.setAttribute("cy", y.toFixed(2));
        circle.setAttribute("r", (2.2 + random() * 2.2).toFixed(2));
        nutrientLayer.appendChild(circle);
        nutrientEls.push(circle);
      }

      const bacteriaEls = [];
      const deadEls = [];
      const bodyColors = ["#087d79", "#14948a", "#2aa59a", "#0c6e72"];
      const renderedPositions = positions.slice(0, MAX_LIVE);
      renderedPositions.forEach((pos, index) => {
        const group = document.createElementNS(SVG_NS, "g");
        group.setAttribute("class", "bacterium");
        group.setAttribute("transform", `translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)}) rotate(${pos.angle.toFixed(1)})`);
        group.style.opacity = "0";

        const width = 22 + pos.shade * 5;
        const rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("class", "bacterium-body");
        rect.setAttribute("x", (-width / 2).toFixed(2));
        rect.setAttribute("y", "-7");
        rect.setAttribute("width", width.toFixed(2));
        rect.setAttribute("height", "14");
        rect.setAttribute("rx", "7");
        rect.setAttribute("fill", bodyColors[index % bodyColors.length]);

        const detail = document.createElementNS(SVG_NS, "line");
        detail.setAttribute("class", "bacterium-line");
        detail.setAttribute("x1", (-width * .18).toFixed(2));
        detail.setAttribute("x2", (width * .18).toFixed(2));
        detail.setAttribute("y1", "0");
        detail.setAttribute("y2", "0");
        group.append(rect, detail);
        bacteriaLayer.appendChild(group);
        bacteriaEls.push(group);

        const deadGroup = document.createElementNS(SVG_NS, "g");
        const deadPos = renderedPositions[renderedPositions.length - 1 - index] || pos;
        deadGroup.setAttribute("class", "dead-cell");
        deadGroup.setAttribute("transform", `translate(${deadPos.x.toFixed(2)} ${deadPos.y.toFixed(2)}) rotate(${(deadPos.angle + 25).toFixed(1)})`);
        deadGroup.style.opacity = "0";
        const deadPath = document.createElementNS(SVG_NS, "path");
        deadPath.setAttribute("d", "M-10,-3 Q-5,-7 0,-3 M3,3 Q7,7 11,2");
        deadPath.setAttribute("fill", "none");
        deadPath.setAttribute("stroke", "#657273");
        deadPath.setAttribute("stroke-width", "4");
        deadPath.setAttribute("stroke-linecap", "round");
        deadGroup.appendChild(deadPath);
        deadLayer.appendChild(deadGroup);
        deadEls.push(deadGroup);
      });

      function buildRateTrack(containerId, kind) {
        const container = document.getElementById(containerId);
        const segments = [];
        for (let i = 0; i < 5; i++) {
          const part = document.createElement("i");
          part.className = kind;
          container.appendChild(part);
          segments.push(part);
        }
        return segments;
      }

      const birthSegments = buildRateTrack("birthRate", "birth");
      const deathSegments = buildRateTrack("deathRate", "death");

      function rateWord(level) {
        return ["keine", "gering", "mittel", "mittel", "hoch", "hoch"][level];
      }

      function setSegments(segments, level) {
        segments.forEach((part, index) => part.classList.toggle("on", index < level));
      }

      function phaseIndexAt(t) {
        return phases.findIndex(phase => t < phase.end);
      }

      let currentTime = 0;

      function update(t) {
        t = clamp(t, 0, 100);
        currentTime = t;
        const state = stateAt(t);
        const point = chartPoint(t);
        const phaseIndex = phaseIndexAt(t);
        const phase = phases[phaseIndex];

        curveActive.setAttribute("d", activePathAt(t));
        timeHit.setAttribute("x1", point.x);
        timeHit.setAttribute("x2", point.x);
        timeLine.setAttribute("x1", point.x);
        timeLine.setAttribute("x2", point.x);
        timeDot.setAttribute("cx", point.x);
        timeDot.setAttribute("cy", point.y);
        timeHandle.setAttribute("aria-valuenow", String(Math.round(t)));
        timeHandle.setAttribute("aria-valuetext", `${Math.round(t)} Zeiteinheiten, ${phase.name}`);

        phaseBadge.textContent = phase.name;
        populationBadge.textContent = phase.population;
        [phaseBadge, populationBadge].forEach(badge => {
          badge.style.background = phase.color;
          badge.style.color = phase.ink;
        });
        document.querySelectorAll(".phase-band").forEach((band, index) => {
          band.classList.toggle("active", index === phaseIndex);
        });

        foodValue.textContent = `${Math.round(state.food)} %`;
        spaceValue.textContent = `${Math.round(state.space)} %`;
        foodFill.style.width = `${state.food}%`;
        spaceFill.style.width = `${state.space}%`;

        nutrientEls.forEach((el, index) => {
          el.style.opacity = index < state.nutrientCount ? String(.58 + (index % 4) * .1) : "0";
        });
        bacteriaEls.forEach((el, index) => {
          el.style.opacity = index < state.liveCount ? "1" : "0";
        });
        deadEls.forEach((el, index) => {
          el.style.opacity = index < state.deadCount ? String(.52 + (index % 3) * .12) : "0";
        });

        setSegments(birthSegments, state.birth);
        setSegments(deathSegments, state.death);
        document.getElementById("birthLabel").textContent = rateWord(state.birth);
        document.getElementById("deathLabel").textContent = rateWord(state.death);
      }

      let animationFrame = null;
      let previousTime = null;

      function stopAnimation() {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        previousTime = null;
        playButton.classList.remove("is-playing");
        playButton.setAttribute("aria-label", "Animation abspielen");
      }

      function animate(timestamp) {
        if (previousTime === null) previousTime = timestamp;
        const elapsed = timestamp - previousTime;
        previousTime = timestamp;
        let next = currentTime + elapsed / 210;
        if (next >= 100) {
          next = 100;
          update(next);
          stopAnimation();
          return;
        }
        update(next);
        animationFrame = requestAnimationFrame(animate);
      }

      playButton.addEventListener("click", () => {
        if (animationFrame !== null) {
          stopAnimation();
          return;
        }
        if (currentTime >= 100) update(0);
        playButton.classList.add("is-playing");
        playButton.setAttribute("aria-label", "Animation pausieren");
        animationFrame = requestAnimationFrame(animate);
      });

      function timeFromPointer(event) {
        const rect = growthChart.getBoundingClientRect();
        const svgX = (event.clientX - rect.left) * 900 / rect.width;
        return (svgX - 76) / 7.72;
      }

      let dragging = false;

      growthChart.addEventListener("pointerdown", event => {
        stopAnimation();
        dragging = true;
        growthChart.setPointerCapture?.(event.pointerId);
        update(timeFromPointer(event));
      });

      growthChart.addEventListener("pointermove", event => {
        if (!dragging) return;
        event.preventDefault();
        update(timeFromPointer(event));
      });

      function finishDragging(event) {
        if (!dragging) return;
        dragging = false;
        if (growthChart.hasPointerCapture?.(event.pointerId)) {
          growthChart.releasePointerCapture(event.pointerId);
        }
      }

      growthChart.addEventListener("pointerup", finishDragging);
      growthChart.addEventListener("pointercancel", finishDragging);

      timeHandle.addEventListener("keydown", event => {
        let next = currentTime;
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") next -= 1;
        else if (event.key === "ArrowRight" || event.key === "ArrowUp") next += 1;
        else if (event.key === "PageDown") next -= 5;
        else if (event.key === "PageUp") next += 5;
        else if (event.key === "Home") next = 0;
        else if (event.key === "End") next = 100;
        else return;
        event.preventDefault();
        stopAnimation();
        update(next);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopAnimation();
      });

      update(0);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081525">
<title>Größenvergleich – Lungenzelle, Bakterien und Viren</title>
<style>
:root{color-scheme:dark;--bg:#0a0d11;--panel:#121821;--line:#39424c;--bright:#eef2f4;--muted:#a6afb8;--teal:#9dc7c7;--lime:#c9d2d9;--coral:#d8d8d8;--blue:#b7c1cc}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--bright);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{height:100vh;height:100dvh;max-width:1920px;margin:auto;display:flex;flex-direction:column;padding:clamp(9px,1.5vh,16px);gap:9px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:clamp(19px,2.45vw,28px);line-height:1.1;margin:0;letter-spacing:-.036em}.focusbar{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#31536a transparent;flex-shrink:0;padding-bottom:2px}
.focus{white-space:nowrap;display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:11px;background:#112638;border:1px solid #294558;color:#d7e5ec;min-height:48px;font-weight:680;font-size:12px;line-height:1.3}
.focus:hover,.focus:focus-visible{border-color:#7ba3b4;outline:none}.focus.active{border-color:#4ad3ba;background:#173e40;box-shadow:inset 0 0 0 1px #318e81}
.focus small{font-size:11px;font-weight:500;color:#a8bdc8}.focus-dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.stage{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:16px;border:1px solid #2d4960;background:#0e1217;isolation:isolate}
#world{width:100%;height:100%;touch-action:none;display:block;cursor:grab;outline:none}#world:active{cursor:grabbing}#world:focus-visible{outline:3px solid var(--teal);outline-offset:-4px}
.stage-note{position:absolute;z-index:2;left:14px;top:13px;color:#abc1ce;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:720;pointer-events:none;display:flex;align-items:center;gap:7px;background:#081825ca;border:1px solid #2b4957;border-radius:8px;padding:8px 9px}
.stage-note::before{content:"";width:6px;height:6px;background:var(--teal);border-radius:50%}
.zoomtools{position:absolute;z-index:2;right:13px;top:12px;display:flex;align-items:center;gap:6px;background:#061a2de8;border:1px solid #2d4a60;border-radius:11px;padding:5px;box-shadow:0 4px 13px #0004}
.zoomtools button{width:38px;height:38px;border:1px solid #365970;border-radius:8px;color:#eff8ff;background:#163248;font-size:23px;line-height:1}
.zoomtools button:hover{background:#25536d}.zoomtools button:focus-visible,.focus:focus-visible,.bottom button:focus-visible{outline:2px solid white;outline-offset:2px}
.zoomtools #allBtn{width:auto;padding:0 10px;font-size:12px;font-weight:800}
.zoom-level{color:#b9d5e0;min-width:67px;text-align:center;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.scales{position:absolute;left:15px;bottom:13px;z-index:2;padding:11px 13px;border:1px solid #375064;border-radius:11px;background:#071728e8;pointer-events:none;min-width:160px}
#scaleText{font-size:13px;color:#e3f0f5;font-weight:780;font-variant-numeric:tabular-nums}
#scaleBar{height:9px;border:solid #dceef4;border-width:0 2px 2px;margin-top:8px;width:100px}
.scalehint{font-size:10px;color:#9cb4c4;margin-top:7px}
.bottom{display:grid;grid-template-columns:auto;gap:8px;align-items:center;background:#102435;border:1px solid #2d495a;border-radius:12px;padding:10px 14px;min-height:54px}
.bottom-controls{display:flex;align-items:center;justify-content:flex-end;gap:10px}label[for=zoomSlider]{white-space:nowrap;color:#a8bac6;font-size:12px;font-weight:700}#zoomSlider{width:clamp(90px,15vw,190px);height:26px;accent-color:#4edcc5;touch-action:pan-y}
@media(max-width:700px){.app{gap:7px;padding:7px}.focus{min-height:43px;padding:7px 9px}.focus small{display:none}.bottom{grid-template-columns:1fr;gap:4px;padding:7px 10px}.bottom-controls{justify-content:space-between}.zoomtools{right:7px;top:7px}.scales{left:8px;bottom:8px}}
@media(max-height:590px){.app{gap:5px}.focus{min-height:39px}.bottom{min-height:48px;padding:7px 12px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Größenvergleich: Lungenzelle, Bakterien und Viren</h1></div>
</header>
<nav class="focusbar" id="focusbar" aria-label="Objekte auswählen">
 <button type="button" class="focus active" data-focus="all"><span class="focus-dot" style="background:#d6d9dd"></span>Alle im Überblick</button>
 <button type="button" class="focus" data-focus="cell"><span class="focus-dot" style="background:#e0e3e6"></span><span>Lungenzelle <small>10 µm</small></span></button>
 <button type="button" class="focus" data-focus="coli"><span class="focus-dot" style="background:#cbced2"></span><span>E. coli <small>2 µm</small></span></button>
 <button type="button" class="focus" data-focus="pneumo"><span class="focus-dot" style="background:#bcc1c6"></span><span>Pneumokokkus <small>1 µm</small></span></button>
 <button type="button" class="focus" data-focus="corona"><span class="focus-dot" style="background:#f0f1f2"></span><span>Coronavirus <small>100 nm</small></span></button>
 <button type="button" class="focus" data-focus="flu"><span class="focus-dot" style="background:#aeb4bb"></span><span>Influenzavirus <small>100 nm</small></span></button>
</nav>
<main class="stage" id="stage">
 <canvas id="world" tabindex="0" role="img" aria-label="Interaktive maßstabsgetreue Zeichnung einer Lungenzelle, zweier Bakterien und zweier Viren. Mit Mausrad, zwei Fingern oder den Plus-Minus-Tasten zoomen."></canvas>
 <div class="zoomtools" aria-label="Zoomsteuerung"><button id="minus" aria-label="Verkleinern" title="Verkleinern">−</button><span class="zoom-level" id="zoomReadout">1×</span><button id="plus" aria-label="Vergrößern" title="Vergrößern">+</button><button id="allBtn" title="Alle Objekte anzeigen">Alle</button></div>
 <div class="scales" aria-label="Maßstab"><div id="scaleText">1 µm</div><div id="scaleBar"></div><div class="scalehint">Balken = echte relative Größe</div></div>
</main>
<section class="bottom"><div class="bottom-controls"><label for="zoomSlider">Zoom</label><input type="range" id="zoomSlider" min="0" max="1000" step="1" value="0" aria-label="Zoomstufe"></div></section>
</div>
<script>
(()=>{'use strict';
 const canvas=document.getElementById('world'), stage=document.getElementById('stage'), ctx=canvas.getContext('2d',{alpha:false});
 const slider=document.getElementById('zoomSlider'),zoomReadout=document.getElementById('zoomReadout'),scaleBar=document.getElementById('scaleBar'),scaleText=document.getElementById('scaleText');
 const focusBtns=[...document.querySelectorAll('[data-focus]')];
 const obj=[
  {id:'cell',label:'Alveolarzelle Typ II',mini:'Lungenzelle',x:-5.4,y:0,w:10,h:10,color:'#e1e4e8',size:'Ø 10 µm'},
  {id:'coli',label:'Escherichia coli',mini:'E. coli',x:3.1,y:0,w:2,h:.8,color:'#e8ecef',size:'2 × 0,8 µm'},
  {id:'pneumo',label:'Pneumokokkus',mini:'Pneumokokkus',x:6.2,y:0,w:1,h:1,color:'#cfd4d8',size:'Ø 1 µm'},
  {id:'corona',label:'SARS-CoV-2',mini:'Coronavirus',x:8.6,y:0,w:.1,h:.1,color:'#f0f0f0',size:'Ø 100 nm'},
  {id:'flu',label:'Influenzavirus',mini:'Influenzavirus',x:10.0,y:0,w:.1,h:.1,color:'#babfc6',size:'Ø 100 nm'}
 ];
 let W=0,H=0,dpr=1,cam={x:0,y:0,z:1},overview=1,maxZoom=6000,selected='all',tween=null;
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),tau=Math.PI*2;
 function worldToScreen(x,y){return{x:W*.5+(x-cam.x)*cam.z,y:H*.51+(y-cam.y)*cam.z};}
 function screenToWorld(x,y){return{x:cam.x+(x-W*.5)/cam.z,y:cam.y+(y-H*.51)/cam.z};}
 function computeOverview(){return Math.max(1,Math.min((W-95)/21.2,(H-100)/11.2));}
 function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const old=overview;W=r.width;H=r.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);overview=computeOverview();if(selected==='all' || cam.z===old){cam.x=-.1;cam.y=0;cam.z=overview;}else cam.z=clamp(cam.z,overview,maxZoom);draw();}
 function choose(id){selected=id;focusBtns.forEach(b=>{b.classList.toggle('active',b.dataset.focus===id);b.setAttribute('aria-pressed',String(b.dataset.focus===id));});}
 function goto(id){cancelTween();choose(id);let target;if(id==='all'){target={x:-.1,y:0,z:overview};}else{const o=obj.find(o=>o.id===id);target={x:o.x,y:o.y,z:clamp(Math.min(W*.32/o.w,H*.48/o.h),overview,maxZoom)};}
  let start={...cam},t0=performance.now();function step(now){let p=clamp((now-t0)/650,0,1);let e=p*p*(3-2*p);cam.x=start.x+(target.x-start.x)*e;cam.y=start.y+(target.y-start.y)*e;cam.z=start.z*Math.pow(target.z/start.z,e);draw();if(p<1)tween=requestAnimationFrame(step);else tween=null;}tween=requestAnimationFrame(step);
 }
 function cancelTween(){if(tween){cancelAnimationFrame(tween);tween=null;}}
 function markCustom(){if(selected!=='free'){selected='free';focusBtns.forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false');});}}
 function zoomAt(mult,px=W/2,py=H/2){cancelTween();let world=screenToWorld(px,py);let z=clamp(cam.z*mult,overview,maxZoom);cam.z=z;cam.x=world.x-(px-W*.5)/z;cam.y=world.y-(py-H*.51)/z;markCustom();draw();}
 function rr(x,y,w,h,r){let q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();}
 function oval(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,tau);}
 function stroke(color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
 function cell(){
  // Unregelmäßige, flache Lungenzelle im elektronenmikroskopischen Stil.
  ctx.save();
  const membrane=new Path2D();
  membrane.moveTo(-4.9,-.9);
  membrane.bezierCurveTo(-4.6,-2.8,-2.9,-4.2,-.8,-4.45);
  membrane.bezierCurveTo(1.35,-4.75,3.6,-3.8,4.55,-2.1);
  membrane.bezierCurveTo(5.05,-1.15,4.9,.1,4.45,1.05);
  membrane.bezierCurveTo(4.1,1.8,3.5,2.05,3.25,2.7);
  membrane.bezierCurveTo(2.8,3.9,1.2,4.7,-.65,4.4);
  membrane.bezierCurveTo(-2.4,4.1,-4.1,3.35,-4.85,1.8);
  membrane.bezierCurveTo(-5.2,1.1,-5.15,.05,-4.9,-.9);
  membrane.closePath();
  const grad=ctx.createRadialGradient(-1.2,-1.7,.25,.4,.15,6.4);
  grad.addColorStop(0,'#f2f2f2');
  grad.addColorStop(.32,'#b9bcc1');
  grad.addColorStop(.75,'#777d84');
  grad.addColorStop(1,'#43484f');
  ctx.fillStyle=grad;ctx.fill(membrane);
  ctx.lineWidth=.11;ctx.strokeStyle='#f5f7f8';ctx.stroke(membrane);
  ctx.lineWidth=.045;ctx.strokeStyle='#262b31';ctx.stroke(membrane);
  ctx.clip(membrane);

  // feine körnige Matrix
  ctx.globalAlpha=.23;
  for(let i=0;i<210;i++){
    const a=i*2.399963, r=4.65*Math.sqrt((i+.5)/210);
    const x=Math.cos(a)*r*.97, y=Math.sin(a)*r*.82;
    const s=.022+((i*17)%7)*.006;
    ctx.fillStyle=i%4===0?'#f5f6f7':i%3===0?'#cfd4d9':'#7c838b';
    oval(x,y,s,s);ctx.fill();
  }
  ctx.globalAlpha=.12;
  for(let i=0;i<34;i++){
    const x=-4.4+i*.27;
    ctx.strokeStyle=i%2?'#d9dde0':'#5a6067';ctx.lineWidth=.028;
    ctx.beginPath();ctx.moveTo(x,-4.3);ctx.lineTo(x+1.5,4.1);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // ruhigerer Zellkern ohne gewundene Linien
  ctx.save();ctx.translate(-.4,.25);ctx.rotate(-.16);
  let gN=ctx.createRadialGradient(-.55,-.45,.15,0,0,2.1);
  gN.addColorStop(0,'#d7dade');gN.addColorStop(.58,'#969ca3');gN.addColorStop(1,'#555b62');
  ctx.fillStyle=gN;oval(0,0,1.95,1.55);ctx.fill();
  ctx.lineWidth=.07;ctx.strokeStyle='#eceeef';ctx.stroke();
  ctx.lineWidth=.028;ctx.strokeStyle='#40464d';ctx.stroke();
  ctx.globalAlpha=.22;
  for(let i=0;i<55;i++){
    let a=i*1.93,r=1.48*Math.sqrt((i+.4)/55),x=Math.cos(a)*r*0.92,y=Math.sin(a)*r*0.78;
    ctx.fillStyle=i%2?'#f2f4f5':'#697079';
    oval(x,y,.034,.034);ctx.fill();
  }
  ctx.globalAlpha=1;
  let gNu=ctx.createRadialGradient(.22,.08,.02,.22,.08,.52);
  gNu.addColorStop(0,'#4e545b');gNu.addColorStop(.55,'#70767d');gNu.addColorStop(1,'#8a9096');
  ctx.fillStyle=gNu;oval(.22,.08,.52,.46);ctx.fill();
  ctx.lineWidth=.02;ctx.strokeStyle='#d6dade';ctx.stroke();
  ctx.restore();

  // Vesikel / Lamellarkörperchen
  [[-3.15,-2.0,.43],[-2.05,2.55,.37],[1.95,-2.45,.42],[3.15,1.9,.34],[-3.5,.85,.31],[2.8,-.65,.28]].forEach(([x,y,r])=>{
    ctx.save();ctx.translate(x,y);
    let gv=ctx.createRadialGradient(-r*.25,-r*.2,.02,0,0,r);
    gv.addColorStop(0,'#f8f8f8');gv.addColorStop(.55,'#aeb4bb');gv.addColorStop(1,'#61676e');
    ctx.fillStyle=gv;oval(0,0,r,r);ctx.fill();ctx.lineWidth=.03;ctx.strokeStyle='#eceff1';
    for(let t=.08;t<r*.95;t+=.08){oval(0,0,t,t);ctx.stroke();}
    ctx.restore();
  });

  // einige längliche Mitochondrien / Membranstrukturen
  [[2.2,2.55,.85,.34,.38],[-2.5,-.95,.77,.28,-.72],[1.1,3.15,.62,.23,.95]].forEach(p=>{ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(p[4]);
    let gm=ctx.createLinearGradient(-p[2],0,p[2],0);gm.addColorStop(0,'#70767d');gm.addColorStop(.5,'#c5c9ce');gm.addColorStop(1,'#6a7076');ctx.fillStyle=gm;
    oval(0,0,p[2],p[3]);ctx.fill();ctx.lineWidth=.03;ctx.strokeStyle='#f0f2f3';ctx.stroke();ctx.strokeStyle='#4b5259';ctx.lineWidth=.028;
    for(let i=0;i<3;i++){const yy=(i-1)*p[3]*.52;ctx.beginPath();ctx.moveTo(-p[2]*.72,yy);ctx.bezierCurveTo(-p[2]*.28,yy-p[3]*.55,p[2]*.1,yy+p[3]*.55,p[2]*.66,yy);ctx.stroke();}
    ctx.restore();});

  ctx.restore();
 }
 function coli(){
   // Kontrastreiches stäbchenförmiges Bakterium, damit es besser erkennbar ist.
   ctx.save();ctx.rotate(-.1);
   let body=new Path2D();
   rr(-1,-.4,2,.8,.4);
   let g=ctx.createLinearGradient(-1,0,1,0);g.addColorStop(0,'#545b62');g.addColorStop(.42,'#dfe4e8');g.addColorStop(.55,'#f4f6f8');g.addColorStop(1,'#616870');
   ctx.fillStyle=g;ctx.fill(body);ctx.lineWidth=.045;ctx.strokeStyle='#f7f8f9';ctx.stroke(body);ctx.lineWidth=.028;ctx.strokeStyle='#252a2f';ctx.stroke(body);
   // Innenraum deutlicher ausfüllen statt nur punktieren
   ctx.save();rr(-.92,-.31,1.84,.62,.29);ctx.clip();
   let gi=ctx.createLinearGradient(-.92,0,.92,0);gi.addColorStop(0,'#6a7179');gi.addColorStop(.46,'#c8ced4');gi.addColorStop(.54,'#e6eaed');gi.addColorStop(1,'#6b727a');
   ctx.fillStyle=gi;rr(-.92,-.31,1.84,.62,.29);ctx.fill();
   ctx.globalAlpha=.16;
   for(let i=0;i<60;i++){
     let x=-.8+(i%15)*.115,y=-.22+Math.floor(i/15)*.15;
     ctx.fillStyle=i%2?'#ffffff':'#646b73';oval(x,y,.013,.013);ctx.fill();
   }
   ctx.globalAlpha=.38;
   ctx.strokeStyle='#f5f7f8';ctx.lineWidth=.022;
   for(let x=-.72;x<.76;x+=.18){ctx.beginPath();ctx.moveTo(x,-.28);ctx.lineTo(x+.22,.28);ctx.stroke();}
   ctx.globalAlpha=.82;
   ctx.strokeStyle='#444b53';ctx.lineWidth=.04;
   ctx.beginPath();ctx.moveTo(-.72,-.03);ctx.bezierCurveTo(-.44,-.2,-.1,.16,.18,.04);ctx.bezierCurveTo(.38,-.05,.52,.07,.71,0);ctx.stroke();
   ctx.beginPath();ctx.moveTo(-.58,.14);ctx.bezierCurveTo(-.28,.02,.06,.24,.46,.14);ctx.stroke();
   ctx.restore();
   // kurze feine Pili / Randsaum
   ctx.strokeStyle='#dfe3e6';ctx.lineWidth=.018;
   [[-.8,-.28,-1.02,-.42],[-.47,-.39,-.54,-.58],[-.1,-.4,-.05,-.58],[.25,-.38,.35,-.57],[.62,-.29,.86,-.41],[-.75,.26,-1.0,.37],[-.2,.4,-.18,.58],[.28,.39,.42,.56],[.75,.22,.98,.3]].forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo((a[0]+a[2])*.5,(a[1]+a[3])*.5-.02,a[2],a[3]);ctx.stroke();});
   // ein Flagellum macht das Bakterium besser lesbar, bleibt aber dezent
   ctx.strokeStyle='#d2d7db';ctx.lineWidth=.02;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(.98,.02);ctx.bezierCurveTo(1.2,-.04,1.34,.12,1.5,.04);ctx.bezierCurveTo(1.72,-.07,1.88,.12,2.06,0);ctx.stroke();
   ctx.restore();
 }
 function pneumo(){
   ctx.save();ctx.rotate(.12);
   const g=ctx.createRadialGradient(-.1,-.12,.03,0,0,.56);g.addColorStop(0,'#eceff2');g.addColorStop(.55,'#aeb4ba');g.addColorStop(1,'#5f666e');
   ctx.fillStyle=g;oval(0,0,.5,.5);ctx.fill();ctx.lineWidth=.03;ctx.strokeStyle='#f3f4f5';ctx.stroke();ctx.lineWidth=.02;ctx.strokeStyle='#2d3338';ctx.stroke();
   ctx.globalAlpha=.23;for(let i=0;i<22;i++){let a=i*1.71,r=.33*Math.sqrt((i+.4)/22);ctx.fillStyle=i%2?'#f6f7f8':'#6e747c';oval(Math.cos(a)*r,Math.sin(a)*r,.018,.018);ctx.fill();}ctx.globalAlpha=1;
   ctx.restore();
 }
 function virus(isCorona){ctx.save();
   const shellR=.0385, outerR=.05;
   const shell=ctx.createRadialGradient(-.01,-.012,.002,0,0,shellR);
   shell.addColorStop(0,'#f0f1f2');shell.addColorStop(.6,isCorona?'#9ca2aa':'#8b929a');shell.addColorStop(1,isCorona?'#565d65':'#4f5660');
   // Spikes/Hüllfortsätze im EM-Stil
   const n=isCorona?15:17;
   for(let i=0;i<n;i++){
     let a=i*tau/n;ctx.save();ctx.rotate(a);ctx.strokeStyle='#d8dde0';ctx.lineWidth=.0027;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-shellR*.98);ctx.lineTo(0,-.0475);ctx.stroke();
     ctx.fillStyle=isCorona?'#eef0f1':'#cfd4d9';oval(0,-.048,.0033,isCorona?.0031:.0038);ctx.fill();ctx.restore();
   }
   ctx.fillStyle=shell;oval(0,0,shellR,shellR);ctx.fill();ctx.lineWidth=.0026;ctx.strokeStyle='#f6f7f8';ctx.stroke();ctx.lineWidth=.0022;ctx.strokeStyle='#2b3137';ctx.stroke();
   ctx.save();oval(0,0,.034,.034);ctx.clip();
   ctx.globalAlpha=.58;ctx.strokeStyle=isCorona?'#41474e':'#373d44';ctx.lineWidth=.003;
   ctx.beginPath();for(let i=0;i<34;i++){let a=i*.47,r=.0025+i*.00083;let x=Math.cos(a)*r,y=Math.sin(a)*r;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
   ctx.globalAlpha=.18;for(let i=0;i<22;i++){let a=i*2.1,r=.028*Math.sqrt((i+.3)/22);ctx.fillStyle=i%2?'#fafafa':'#7b828a';oval(Math.cos(a)*r,Math.sin(a)*r,.0026,.0026);ctx.fill();}
   ctx.globalAlpha=1;ctx.restore();
   ctx.restore();
 }
 function renderBackground(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d11';ctx.fillRect(0,0,W,H);
  // Dezente wissenschaftliche Gitterlinien: Abstand skaliert mit der Kamera.
  const niceStep=nice(75/cam.z),px=niceStep*cam.z;ctx.strokeStyle='#2a323a';ctx.lineWidth=1;ctx.globalAlpha=.32;const left=screenToWorld(0,0).x,top=screenToWorld(0,0).y;let nx=0;for(let v=Math.floor(left/niceStep)*niceStep;nx<250&&worldToScreen(v,0).x<W;v+=niceStep,nx++){let x=Math.round(worldToScreen(v,0).x)+.5;if(x>=0){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}}
  let ny=0;for(let v=Math.floor(top/niceStep)*niceStep;ny<250&&worldToScreen(0,v).y<H;v+=niceStep,ny++){let y=Math.round(worldToScreen(0,v).y)+.5;if(y>=0){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}ctx.globalAlpha=1;
  // gemeinsame horizontale Ausrichtung
  const a=worldToScreen(0,0);ctx.strokeStyle='#4c555d';ctx.lineWidth=1;ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(0,Math.round(a.y)+.5);ctx.lineTo(W,Math.round(a.y)+.5);ctx.stroke();ctx.setLineDash([]);
 }
 function nice(value){let e=Math.pow(10,Math.floor(Math.log10(Math.max(value,1e-8))));let n=value/e;return (n<=1?1:n<=2?2:n<=5?5:10)*e;}
 function dim(v){return v>=1?number(v)+' µm':number(v*1000)+' nm';}
 function number(v){return new Intl.NumberFormat('de-DE',{maximumFractionDigits:v<.01?2:v<1?1:0}).format(v);}
 function updateScale(){let v=nice(105/cam.z),width=v*cam.z;if(width>170){v/=2;width=v*cam.z;}scaleText.textContent=dim(v);scaleBar.style.width=Math.max(4,width)+'px';zoomReadout.textContent=number(cam.z/overview)+'×';let n=Math.log(cam.z/overview)/Math.log(maxZoom/overview);slider.value=Math.round(clamp(n,0,1)*1000);}
 function labelAt(o,p){const pos=worldToScreen(o.x,o.y);return pos;}
 function drawLabels(){ctx.setTransform(dpr,0,0,dpr,0,0);
  if(cam.z>overview*3.5){let near=obj.find(o=>o.id===selected);if(near){const p=worldToScreen(near.x,near.y);if(p.x>0&&p.x<W&&p.y>0&&p.y<H){drawTopLabel(near);}}return;}
  // In der Gesamtansicht bleiben selbst kleinste Objekte unvergrößert. Die Textlabels stehen daneben.
  const fontSize=W<650?11:13;ctx.font='700 '+fontSize+'px system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  let labels=obj.map(o=>({o,p:labelAt(o),width:Math.max(ctx.measureText(o.mini).width,ctx.measureText(o.size).width)+18}));
  let rowY=H*.51+Math.min(6.1*cam.z,H*.35);rowY=Math.min(H-100,rowY);
  // Labelpositionen in der Gesamtübersicht ggf. leicht auseinanderziehen
  let prev=-100;labels.forEach((it,i)=>{let x=clamp(it.p.x,Math.max(40,it.width*.5+8),W-Math.max(40,it.width*.5+8));if(x-it.width/2<prev+5)x=prev+5+it.width/2;it.x=x;prev=x+it.width/2;});
  if(prev>W-12){let shift=prev-(W-12);labels.forEach(it=>it.x-=shift);}
  labels.forEach(({o,p,x,width})=>{if(p.x<-50||p.x>W+50)return;
   const y=rowY+(o.id==='cell'?-35:o.id==='coli'?-6:o.id==='corona'?10:o.id==='flu'?48:0);
   ctx.strokeStyle='#717880';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y+Math.min(o.h*cam.z/2,190));ctx.lineTo(x,y-18);ctx.stroke();
   ctx.fillStyle='#11171de8';rr(x-width/2,y-18,width,38,7);ctx.fill();ctx.strokeStyle='#464d55';ctx.stroke();ctx.textAlign='center';ctx.fillStyle=o.color;ctx.font='700 '+fontSize+'px system-ui, sans-serif';ctx.fillText(o.mini,x,y-5);ctx.font='500 '+(fontSize-1)+'px system-ui, sans-serif';ctx.fillStyle='#d9dde0';ctx.fillText(o.size,x,y+10);
  });
 }
 function drawTopLabel(o){const x=16,y=60;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font='700 14px system-ui';const width=Math.max(200,ctx.measureText(o.label).width+20);rr(x,y,width,47,8);ctx.fillStyle='#12171cdb';ctx.fill();ctx.strokeStyle='#4a5158';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=o.color;ctx.fillText(o.label,x+12,y+19);ctx.font='500 12px system-ui';ctx.fillStyle='#d9dde0';ctx.fillText(o.size,x+12,y+37);}
 function draw(){if(!W||!H)return;renderBackground();obj.forEach(o=>{const p=worldToScreen(o.x,o.y),rx=o.w*.5*cam.z,ry=o.h*.5*cam.z;if(p.x+rx<-10||p.x-rx>W+10||p.y+ry<-10||p.y-ry>H+10)return;
   ctx.save();ctx.translate(p.x,p.y);ctx.scale(cam.z,cam.z);if(o.id==='cell')cell();else if(o.id==='coli')coli();else if(o.id==='pneumo')pneumo();else virus(o.id==='corona');ctx.restore();});
  drawLabels();updateScale();
 }
 // Maus, Touch/Pencil: verschieben, Zwei-Finger-Zoom mit festem Bezugspunkt.
 const pointers=new Map();let gesture=null;
 function geometry(){let pts=[...pointers.values()];if(pts.length<2)return null;let a=pts[0],b=pts[1];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,dist:Math.hypot(a.x-b.x,a.y-b.y)};}
 function local(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
 canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();cancelTween();const p=local(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);gesture=geometry();});
 canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();let old=pointers.get(e.pointerId),p=local(e);if(pointers.size===1){cam.x-=(p.x-old.x)/cam.z;cam.y-=(p.y-old.y)/cam.z;markCustom();}
  else{const before=gesture||geometry();pointers.set(e.pointerId,p);const after=geometry();if(before&&after){const fixed=screenToWorld(before.x,before.y);cam.z=clamp(cam.z*after.dist/Math.max(4,before.dist),overview,maxZoom);cam.x=fixed.x-(after.x-W*.5)/cam.z;cam.y=fixed.y-(after.y-H*.51)/cam.z;markCustom();}gesture=after;}
  pointers.set(e.pointerId,p);draw();});
 function end(e){pointers.delete(e.pointerId);gesture=geometry();try{canvas.releasePointerCapture(e.pointerId);}catch(_){}}
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
 canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0017),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 canvas.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){e.preventDefault();zoomAt(1.6);}else if(e.key==='-'){e.preventDefault();zoomAt(1/1.6);}else if(e.key==='0'){e.preventDefault();goto('all');}else if(e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?95:35;cam.x+=(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0)/cam.z;cam.y+=(e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0)/cam.z;markCustom();draw();}});
 document.getElementById('plus').addEventListener('click',()=>zoomAt(1.8));document.getElementById('minus').addEventListener('click',()=>zoomAt(1/1.8));document.getElementById('allBtn').addEventListener('click',()=>goto('all'));
 slider.addEventListener('input',()=>{const target=overview*Math.pow(maxZoom/overview,Number(slider.value)/1000);zoomAt(target/cam.z);});
 focusBtns.forEach(b=>b.addEventListener('click',()=>goto(b.dataset.focus)));
 const observer=new ResizeObserver(resize);observer.observe(stage);window.addEventListener('resize',resize);resize();
})();
</script>
